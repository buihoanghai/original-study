version: '3.8'

services:
  # MongoDB Database
  mongo:
    image: mongo:7
    container_name: mindmap-mongo
    restart: unless-stopped
    ports:
      - '127.0.0.1:27017:27017'  # Only accessible from localhost
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USER:-admin}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_DATABASE:-mindmap}
    volumes:
      - mongo_data:/data/db
      - mongo_config:/data/configdb
    command: --storageEngine=wiredTiger
    networks:
      - mindmap-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/test --quiet
      interval: 10s
      timeout: 5s
      retries: 5

  # Payload CMS (Backend)
  cms:
    build:
      context: .
      dockerfile: apps/mindmap-cms/Dockerfile
      args:
        NODE_ENV: production
    container_name: mindmap-cms
    restart: unless-stopped
    ports:
      - '127.0.0.1:3001:3001'  # Only accessible from localhost (Nginx will proxy)
    environment:
      NODE_ENV: production
      DATABASE_URL: mongodb://${MONGO_ROOT_USER:-admin}:${MONGO_ROOT_PASSWORD}@mongo:27017/${MONGO_DATABASE:-mindmap}?authSource=admin
      PAYLOAD_SECRET: ${PAYLOAD_SECRET}
      PAYLOAD_PUBLIC_SERVER_URL: ${PAYLOAD_PUBLIC_SERVER_URL}
      PORT: 3001
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - mindmap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3001/admin"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s

  # Web App (Frontend)
  web:
    build:
      context: .
      dockerfile: apps/mindmap-web/Dockerfile
      args:
        NODE_ENV: production
        NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL}
    container_name: mindmap-web
    restart: unless-stopped
    ports:
      - '127.0.0.1:3000:3000'  # Only accessible from localhost (Nginx will proxy)
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_CMS_URL: ${NEXT_PUBLIC_CMS_URL}
      PORT: 3000
    depends_on:
      cms:
        condition: service_healthy
    networks:
      - mindmap-network
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 40s

networks:
  mindmap-network:
    driver: bridge

volumes:
  mongo_data:
    driver: local
  mongo_config:
    driver: local

